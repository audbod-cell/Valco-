<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valco Hall</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        header { background: #003366; color: white; padding: 15px; text-align: center; }
        nav a { margin: 5px; color: white; text-decoration: none; background: #0055a4; padding: 8px; border-radius: 5px; display: inline-block; }
        .container { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <h1>🏠 Valco Hall</h1>
        <nav>
            <a href="#management">Management</a>
            <a href="#workers">Workers</a>
            <a href="#complaints">Complaints</a>
            <a href="#chat">Chat</a>
            <a href="#rooms">Rooms</a>
        </nav>
    </header>
    <div class="container">
        <h2 id="management">Management</h2>
        <p>Hall management information will appear here.</p>
        <h2 id="workers">Workers</h2>
        <p>Worker directory will appear here.</p>
        <h2 id="complaints">Complaints</h2>
        <p>Submit your complaints here.</p>
        <h2 id="chat">Chat</h2>
        <p>Group chat will appear here.</p>
        <h2 id="rooms">Rooms</h2>
        <p>Room status and student lists will appear here.</p>
    </div>
</body>
</html>
